spring.application.name=stock-management
server.port=${PORT:8080}

# Local PostgreSQL. DB_PASSWORD has no default: set it in the git-ignored .env file or the environment.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockdb}
spring.datasource.username=${DB_USERNAME:stockapp}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
# An existing database without Flyway history is taken as version 1 (the single-company schema).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=true

spring.mvc.format.date=iso
spring.thymeleaf.cache=false

# Above the 500 KB logo limit, so a too-large logo gets a form error instead of an error page.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Password for the 'superadmin' login that manages companies; created on first start if missing.
app.superadmin-password=${SUPERADMIN_PASSWORD:superadmin}
