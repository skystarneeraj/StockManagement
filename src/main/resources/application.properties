spring.application.name=stock-management
server.port=${PORT:8080}

# Embedded H2 database stored in ./data (no installation required).
# To use MySQL instead, run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/stockdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.mvc.format.date=iso
spring.thymeleaf.cache=false
