spring.application.name=stock-management
server.port=${PORT:8080}

# Local PostgreSQL. DB_PASSWORD has no default: set it in the git-ignored .env file or the environment.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockdb}
spring.datasource.username=${DB_USERNAME:stockapp}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.mvc.format.date=iso
spring.thymeleaf.cache=false
