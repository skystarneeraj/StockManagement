<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · StockMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center" style="max-width: 500px">
    <h1 class="display-4" th:text="${status}">Error</h1>
    <p class="lead" th:text="${status == 404} ? 'Page not found.' : (${status == 403} ? 'You do not have access to this page.' : 'Something went wrong.')">Something went wrong.</p>
    <a th:href="@{/}" class="btn btn-primary">Back to Dashboard</a>
</div>
</body>
</html>
