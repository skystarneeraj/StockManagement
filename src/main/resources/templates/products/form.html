<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Product', 'products', ~{::main})}">
<body>
<main>
    <h1 class="h3 mb-3" th:text="${product.id == null} ? 'Add Product' : 'Edit Product'">Product</h1>
    <div class="card" style="max-width: 900px">
        <div class="card-body">
            <form th:action="@{/products}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="code">Code *</label>
                        <input type="text" class="form-control" th:field="*{code}" th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{code}"></div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="name">Name *</label>
                        <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="category">Category</label>
                        <select id="category" name="category" class="form-select">
                            <option value="">-- None --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                    th:selected="${product.category != null and product.category.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="uom">Unit</label>
                        <select id="uom" name="uom" class="form-select">
                            <option value="">-- None --</option>
                            <option th:each="u : ${uoms}" th:value="${u.id}" th:text="${u.name}"
                                    th:selected="${product.uom != null and product.uom.id == u.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="supplier">Main supplier</label>
                        <select id="supplier" name="supplier" class="form-select">
                            <option value="">-- None --</option>
                            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"
                                    th:selected="${product.supplier != null and product.supplier.id == s.id}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="hsnCode">HSN / SAC code</label>
                        <input type="text" class="form-control" th:field="*{hsnCode}" th:errorclass="is-invalid"
                               inputmode="numeric" maxlength="8" placeholder="e.g. 8471">
                        <div class="invalid-feedback" th:errors="*{hsnCode}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="gstRate">GST rate (%) *</label>
                        <input type="number" step="0.01" min="0" max="100" class="form-control" th:field="*{gstRate}"
                               th:errorclass="is-invalid" list="gst-rates" required>
                        <datalist id="gst-rates">
                            <option th:each="r : ${gstRates}" th:value="${r}"></option>
                        </datalist>
                        <div class="invalid-feedback" th:errors="*{gstRate}"></div>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <p class="form-text mb-2">Prices below are <strong>before GST</strong>; GST is added on bills.</p>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label" for="costPrice">Cost price *</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{costPrice}" th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{costPrice}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="sellingPrice">Selling price *</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{sellingPrice}" th:errorclass="is-invalid" required>
                        <div class="invalid-feedback" th:errors="*{sellingPrice}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="quantity" th:text="${product.id == null} ? 'Opening stock' : 'In stock'">Stock</label>
                        <input type="number" min="0" class="form-control" th:field="*{quantity}" th:errorclass="is-invalid"
                               th:readonly="${product.id != null}">
                        <div class="invalid-feedback" th:errors="*{quantity}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="reorderLevel">Reorder level</label>
                        <input type="number" min="0" class="form-control" th:field="*{reorderLevel}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{reorderLevel}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="expiryDate">Expiry date</label>
                        <input type="date" class="form-control" th:field="*{expiryDate}" th:errorclass="is-invalid">
                    </div>
                </div>
                <p class="form-text" th:if="${product.id != null}">Stock changes through purchases and sales.</p>
                <div class="mt-3">
                    <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a th:href="@{/products}" class="btn btn-link">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
