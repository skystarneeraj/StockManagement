<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Payments', 'payments', ~{::main})}">
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">Payments</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/payments/new(type='CUSTOMER_RECEIPT')}" class="btn btn-success"><i class="bi bi-arrow-down-circle"></i> Receive from customer</a>
            <a th:href="@{/payments/new(type='SUPPLIER_PAYMENT')}" class="btn btn-outline-primary"><i class="bi bi-arrow-up-circle"></i> Pay supplier</a>
        </div>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Date</th><th>Type</th><th>Party</th><th class="text-end">Amount</th><th>Mode</th><th>Note</th><th>By</th></tr></thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td th:text="${@fmt.date(p.date)}"></td>
                    <td><span class="badge" th:classappend="${p.type.name() == 'CUSTOMER_RECEIPT'} ? 'text-bg-success' : 'text-bg-primary'"
                              th:text="${p.type.label}"></span></td>
                    <td th:text="${p.partyName}"></td>
                    <td class="text-end fw-medium" th:text="${@fmt.money(p.amount)}"></td>
                    <td th:text="${p.mode}"></td>
                    <td class="text-muted" th:text="${p.note}"></td>
                    <td class="text-muted" th:text="${p.createdBy}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}"><td colspan="7" class="text-center text-muted py-4">No payments recorded yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
