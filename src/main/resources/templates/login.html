<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · StockMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 400px">
    <div class="card shadow">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-1"><i class="bi bi-box-seam text-primary"></i> Stock Management</h1>
            <p class="text-center text-muted small mb-4">Sign in to continue</p>

            <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
