<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${labelPlural}, ${section}, ~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${labelPlural}">Items</h1>
        <a th:href="@{|/${section}/new|}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add <span th:text="${label}"></span></a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Name</th><th>Description</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="i : ${items}">
                    <td class="fw-medium" th:text="${i.name}"></td>
                    <td class="text-muted" th:text="${i.description}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{|/${section}/${i.id}/edit|}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{|/${section}/${i.id}/delete|}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this record?')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}"><td colspan="3" class="text-center text-muted py-4">Nothing here yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
