<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('GST Report', 'report-gst', ~{::main})}">
<body>
<main th:with="r=${report}">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-2">
        <div>
            <h1 class="h3 mb-0">GST Report</h1>
            <div class="text-muted">
                <span th:text="${company.name}"></span>
                <span th:if="${company.gstin}" th:text="| · GSTIN ${company.gstin}|"></span>
                · <span th:text="|${@fmt.date(r.from())} to ${@fmt.date(r.to())}|"></span>
            </div>
        </div>
        <form th:action="@{/reports/gst}" method="get" class="d-flex flex-wrap gap-2 align-items-end d-print-none">
            <div><label class="form-label small mb-0" for="from">From</label>
                <input type="date" id="from" name="from" class="form-control" th:value="${r.from()}"></div>
            <div><label class="form-label small mb-0" for="to">To</label>
                <input type="date" id="to" name="to" class="form-control" th:value="${r.to()}"></div>
            <button class="btn btn-primary"><i class="bi bi-funnel"></i> Show</button>
            <button type="button" class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer"></i></button>
        </form>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small">Output GST (on sales)</div>
            <div class="fs-4 fw-semibold" th:text="${@fmt.money(r.salesTotal().tax())}"></div></div></div></div>
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small">Input tax credit (on purchases)</div>
            <div class="fs-4 fw-semibold text-success" th:text="${@fmt.money(r.purchasesTotal().tax())}"></div></div></div></div>
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small" th:text="${r.netPayable().signum() >= 0} ? 'Net GST payable' : 'Credit carried forward'"></div>
            <div class="fs-4 fw-semibold text-danger" th:text="${@fmt.money(r.netPayable().abs())}"></div></div></div></div>
    </div>

    <th:block th:each="part : ${ {'sales', 'purchases'} }"
              th:with="rows=${part == 'sales' ? r.sales() : r.purchases()}, total=${part == 'sales' ? r.salesTotal() : r.purchasesTotal()}">
        <h2 class="h5" th:text="${part == 'sales'} ? 'Sales (outward supplies)' : 'Purchases (inward supplies)'"></h2>
        <div class="card mb-4">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                    <thead><tr><th>Date</th><th>Bill No</th><th th:text="${part == 'sales'} ? 'Customer' : 'Supplier'"></th><th>GSTIN</th>
                        <th class="text-end">Taxable</th><th class="text-end">CGST</th><th class="text-end">SGST</th>
                        <th class="text-end">IGST</th><th class="text-end">Total</th></tr></thead>
                    <tbody>
                    <tr th:each="b : ${rows}">
                        <td th:text="${@fmt.date(b.date())}"></td>
                        <td><a th:href="@{|/${part}/${b.id()}|}" th:text="${b.billNumber()}"></a></td>
                        <td th:text="${b.party()}"></td>
                        <td class="font-monospace small" th:text="${b.partyGstin() ?: 'Unregistered'}"></td>
                        <td class="text-end" th:text="${@fmt.money(b.taxable())}"></td>
                        <td class="text-end" th:text="${@fmt.money(b.cgst())}"></td>
                        <td class="text-end" th:text="${@fmt.money(b.sgst())}"></td>
                        <td class="text-end" th:text="${@fmt.money(b.igst())}"></td>
                        <td class="text-end" th:text="${@fmt.money(b.total())}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}"><td colspan="9" class="text-center text-muted py-3">No bills in this period.</td></tr>
                    </tbody>
                    <tfoot class="table-light fw-semibold">
                    <tr><td colspan="4" class="text-end">Total</td>
                        <td class="text-end" th:text="${@fmt.money(total.taxable())}"></td>
                        <td class="text-end" th:text="${@fmt.money(total.cgst())}"></td>
                        <td class="text-end" th:text="${@fmt.money(total.sgst())}"></td>
                        <td class="text-end" th:text="${@fmt.money(total.igst())}"></td>
                        <td class="text-end" th:text="${@fmt.money(total.total())}"></td></tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </th:block>

    <h2 class="h5">HSN-wise summary of sales</h2>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm mb-0">
                <thead><tr><th>HSN</th><th class="text-end">GST rate</th><th class="text-end">Quantity</th>
                    <th class="text-end">Taxable value</th><th class="text-end">Tax</th></tr></thead>
                <tbody>
                <tr th:each="h : ${r.hsnSummary()}">
                    <td th:text="${#strings.isEmpty(h.hsn())} ? '(not set)' : ${h.hsn()}"></td>
                    <td class="text-end" th:text="${@fmt.rate(h.rate())}"></td>
                    <td class="text-end" th:text="${h.quantity()}"></td>
                    <td class="text-end" th:text="${@fmt.money(h.taxable())}"></td>
                    <td class="text-end" th:text="${@fmt.money(h.tax())}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(r.hsnSummary())}"><td colspan="5" class="text-center text-muted py-3">No sales in this period.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
