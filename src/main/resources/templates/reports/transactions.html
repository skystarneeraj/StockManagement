<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${title}, |report-${section}|, ~{::main})}">
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-2">
        <div>
            <h1 class="h3 mb-0" th:text="${title}">Report</h1>
            <div class="text-muted" th:text="|${@fmt.date(from)} to ${@fmt.date(to)}|"></div>
        </div>
        <form th:action="@{|/reports/${section}|}" method="get" class="d-flex flex-wrap gap-2 align-items-end d-print-none">
            <div><label class="form-label small mb-0" for="from">From</label>
                <input type="date" id="from" name="from" class="form-control" th:value="${from}"></div>
            <div><label class="form-label small mb-0" for="to">To</label>
                <input type="date" id="to" name="to" class="form-control" th:value="${to}"></div>
            <button class="btn btn-primary"><i class="bi bi-funnel"></i> Show</button>
            <button type="button" class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer"></i></button>
        </form>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small">Total (<span th:text="${#lists.size(rows)}"></span> bills)</div>
            <div class="fs-4 fw-semibold" th:text="${@fmt.money(total)}"></div></div></div></div>
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small" th:text="${isSale} ? 'Received' : 'Paid'"></div>
            <div class="fs-4 fw-semibold text-success" th:text="${@fmt.money(paid)}"></div></div></div></div>
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small">Outstanding at billing</div>
            <div class="fs-4 fw-semibold text-danger" th:text="${@fmt.money(due)}"></div></div></div></div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead><tr><th>Date</th><th>Bill No</th><th th:text="${isSale} ? 'Customer' : 'Supplier'"></th>
                    <th class="text-end">Total</th><th class="text-end">Paid</th><th class="text-end">Due</th></tr></thead>
                <tbody>
                <tr th:each="r : ${rows}">
                    <td th:text="${@fmt.date(r.date)}"></td>
                    <td><a th:href="@{|/${section}/${r.id}|}" th:text="${r.billNumber}"></a></td>
                    <td th:text="${r.partyName}"></td>
                    <td class="text-end" th:text="${@fmt.money(r.subtotal)}"></td>
                    <td class="text-end" th:text="${@fmt.money(r.paid)}"></td>
                    <td class="text-end" th:text="${@fmt.money(r.due)}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="text-center text-muted py-4">No bills in this period.</td></tr>
                </tbody>
                <tfoot th:unless="${#lists.isEmpty(rows)}" class="table-light">
                <tr><th colspan="3" class="text-end">Total</th>
                    <th class="text-end" th:text="${@fmt.money(total)}"></th>
                    <th class="text-end" th:text="${@fmt.money(paid)}"></th>
                    <th class="text-end" th:text="${@fmt.money(due)}"></th></tr>
                </tfoot>
            </table>
        </div>
    </div>
</main>
</body>
</html>
