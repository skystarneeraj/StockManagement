<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Stock Report', 'report-stock', ~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0">Stock Report</h1>
            <div class="text-muted" th:text="|As of ${@fmt.date(today)}|"></div>
        </div>
        <button type="button" class="btn btn-outline-secondary d-print-none" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small">Stock value (at cost)</div>
            <div class="fs-4 fw-semibold" th:text="${@fmt.money(totalValue)}"></div></div></div></div>
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small">Total units</div>
            <div class="fs-4 fw-semibold" th:text="${totalUnits}"></div></div></div></div>
        <div class="col-sm-4"><div class="card"><div class="card-body">
            <div class="text-muted small">Products low on stock</div>
            <div class="fs-4 fw-semibold text-danger" th:text="${lowCount}"></div></div></div></div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead><tr><th>Code</th><th>Product</th><th>Category</th><th class="text-end">Qty</th><th class="text-end">Reorder at</th>
                    <th class="text-end">Cost</th><th class="text-end">Value</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td class="text-muted" th:text="${p.code}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.category?.name}"></td>
                    <td class="text-end" th:text="|${p.quantity} ${p.uom?.name ?: ''}|"></td>
                    <td class="text-end" th:text="${p.reorderLevel}"></td>
                    <td class="text-end" th:text="${@fmt.money(p.costPrice)}"></td>
                    <td class="text-end" th:text="${@fmt.money(p.stockValue)}"></td>
                    <td><span class="badge" th:classappend="${p.lowStock} ? 'text-bg-danger' : 'text-bg-success'"
                              th:text="${p.lowStock} ? 'Reorder' : 'OK'"></span></td>
                </tr>
                </tbody>
                <tfoot class="table-light">
                <tr><th colspan="6" class="text-end">Total</th><th class="text-end" th:text="${@fmt.money(totalValue)}"></th><th></th></tr>
                </tfoot>
            </table>
        </div>
    </div>
</main>
</body>
</html>
