<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · StockMS|">StockMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top d-print-none">
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-light btn-sm d-lg-none" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Menu">
                <i class="bi bi-list"></i>
            </button>
            <a class="navbar-brand" th:href="@{/}"><i class="bi bi-box-seam"></i> StockMS</a>
        </div>
        <div class="d-flex align-items-center gap-3 text-light">
            <span class="small"><i class="bi bi-person-circle"></i> <span sec:authentication="name">user</span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="d-flex">
    <aside id="sidebar" class="offcanvas-lg offcanvas-start sidebar bg-body-tertiary border-end d-print-none" tabindex="-1">
        <div class="offcanvas-header d-lg-none">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
        </div>
        <nav class="nav flex-column p-2">
            <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/}"><i class="bi bi-speedometer2"></i> Dashboard</a>

            <div class="nav-heading">Transactions</div>
            <a class="nav-link" th:classappend="${active == 'sales'} ? 'active'" th:href="@{/sales}"><i class="bi bi-receipt"></i> Sales</a>
            <a class="nav-link" th:classappend="${active == 'purchases'} ? 'active'" th:href="@{/purchases}"><i class="bi bi-truck"></i> Purchases</a>
            <a class="nav-link" th:classappend="${active == 'payments'} ? 'active'" th:href="@{/payments}"><i class="bi bi-cash-coin"></i> Payments</a>

            <div class="nav-heading">Inventory</div>
            <a class="nav-link" th:classappend="${active == 'products'} ? 'active'" th:href="@{/products}"><i class="bi bi-box"></i> Products</a>
            <a class="nav-link" th:classappend="${active == 'categories'} ? 'active'" th:href="@{/categories}"><i class="bi bi-tags"></i> Categories</a>
            <a class="nav-link" th:classappend="${active == 'uoms'} ? 'active'" th:href="@{/uoms}"><i class="bi bi-rulers"></i> Units</a>

            <div class="nav-heading">Parties</div>
            <a class="nav-link" th:classappend="${active == 'suppliers'} ? 'active'" th:href="@{/suppliers}"><i class="bi bi-building"></i> Suppliers</a>
            <a class="nav-link" th:classappend="${active == 'customers'} ? 'active'" th:href="@{/customers}"><i class="bi bi-people"></i> Customers</a>

            <div class="nav-heading">Reports</div>
            <a class="nav-link" th:classappend="${active == 'report-sales'} ? 'active'" th:href="@{/reports/sales}"><i class="bi bi-graph-up"></i> Sales Report</a>
            <a class="nav-link" th:classappend="${active == 'report-purchases'} ? 'active'" th:href="@{/reports/purchases}"><i class="bi bi-graph-down"></i> Purchase Report</a>
            <a class="nav-link" th:classappend="${active == 'report-stock'} ? 'active'" th:href="@{/reports/stock}"><i class="bi bi-clipboard-data"></i> Stock Report</a>
            <a class="nav-link" th:classappend="${active == 'report-gst'} ? 'active'" th:href="@{/reports/gst}"><i class="bi bi-percent"></i> GST Report</a>

            <th:block sec:authorize="hasRole('ADMIN')">
                <div class="nav-heading">Admin</div>
                <a class="nav-link" th:classappend="${active == 'settings'} ? 'active'" th:href="@{/settings}"><i class="bi bi-building-gear"></i> Company Settings</a>
                <a class="nav-link" th:classappend="${active == 'users'} ? 'active'" th:href="@{/users}"><i class="bi bi-person-gear"></i> Users</a>
            </th:block>
        </nav>
    </aside>

    <div class="content flex-grow-1 p-3 p-lg-4">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-print-none" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-print-none" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <main th:replace="${content}">Page content</main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
