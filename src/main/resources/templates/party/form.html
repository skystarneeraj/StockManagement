<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${label}, ${section}, ~{::main})}">
<body>
<main>
    <h1 class="h3 mb-3" th:text="${item.id == null} ? |Add ${label}| : |Edit ${label}|">Edit</h1>
    <div class="card" style="max-width: 700px">
        <div class="card-body">
            <form th:action="@{|/${section}|}" th:object="${item}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label" for="name">Name *</label>
                    <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid" required autofocus>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="phone">Phone</label>
                        <input type="text" class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="gstin">GSTIN</label>
                        <input type="text" class="form-control text-uppercase" th:field="*{gstin}" th:errorclass="is-invalid"
                               maxlength="15" placeholder="e.g. 33ABCDE1234F1Z5">
                        <div class="invalid-feedback" th:errors="*{gstin}"></div>
                        <div class="form-text">Leave blank for unregistered parties.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="state">State</label>
                        <select class="form-select" th:field="*{state}">
                            <option value="">-- From GSTIN / not set --</option>
                            <option th:each="s : ${states}" th:value="${s}" th:text="${s}"></option>
                        </select>
                        <div class="form-text">Decides CGST + SGST (same state) or IGST (other state).</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="address">Address</label>
                    <textarea class="form-control" rows="3" th:field="*{address}" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>
                <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a th:href="@{|/${section}|}" class="btn btn-link">Cancel</a>
            </form>
        </div>
    </div>
</main>
</body>
</html>
