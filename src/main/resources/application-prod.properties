# Hosted deployment (Railway). All values below come from environment variables.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# No fallback: the app refuses to start without it, so admin/admin is never live.
app.admin-password=${ADMIN_PASSWORD}

# The host terminates HTTPS at its proxy, so trust its forwarded headers for redirects.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

spring.thymeleaf.cache=true
