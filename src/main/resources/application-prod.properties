# Hosted deployment (Railway). All values below come from environment variables.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.h2.console.enabled=false

# No fallback: the app refuses to start without it, so admin/admin is never live.
app.admin-password=${ADMIN_PASSWORD}

# The host terminates HTTPS at its proxy, so trust its forwarded headers for redirects.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

spring.thymeleaf.cache=true
